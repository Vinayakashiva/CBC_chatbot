<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBC 2.0 · Add a document</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  .admin-card {
    max-width: 480px;
    margin: 80px auto;
    background: var(--navy-900);
    border: 1px solid var(--navy-700);
    border-radius: var(--radius-lg);
    padding: 28px;
    position: relative;
    z-index: 1;
  }
  .admin-card h1 { font-family: var(--font-display); font-size: 1.1rem; margin-top: 0; }
  .admin-card p { color: var(--ink-300); font-size: 0.88rem; line-height: 1.5; }
  .admin-card input[type=file] {
    width: 100%; margin: 16px 0; color: var(--ink-300);
  }
  .admin-card button {
    background: var(--cyan-400); color: var(--navy-950); border: none;
    border-radius: 999px; padding: 10px 22px; font-weight: 600; cursor: pointer;
  }
  .admin-card .flash {
    background: var(--navy-700); border-left: 3px solid var(--cyan-400);
    padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem;
    margin-bottom: 16px; color: var(--ink-100);
  }
  .admin-card a { color: var(--cyan-300); }
</style>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="admin-card">
  <h1>Add a rulebook / brochure PDF</h1>
  <p>Upload the event PDFs (rulebook, schedule, brochure) here. The chatbot will automatically read and index the text so it can answer participant questions from them.</p>
  {% if message %}<div class="flash">{{ message }}</div>{% endif %}
  <form method="post" enctype="multipart/form-data">
    <input type="file" name="pdf" accept="application/pdf" required>
    <button type="submit">Upload &amp; ingest</button>
  </form>
  <p style="margin-top:20px;"><a href="{{ url_for('index') }}">&larr; Back to chatbot</a></p>
</div>
</body>
</html>
